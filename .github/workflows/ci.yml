name: CI

on:
  push:
    branches:
      - main
      - developer
  pull_request:
    branches:
      - main
      - developer

permissions:
  contents: read

jobs:
  # Named `ci` so the check keeps its historical name `ci / test-and-analyze`.
  # The Flutter version comes from flake.lock (devShells.ci in flake.nix), the
  # same one developers use, instead of floating on the stable channel.
  ci:
    name: ci / test-and-analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: |
            ${{ runner.os }}-lfs-

      - name: Git LFS Pull
        run: git lfs pull

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          # Avoids the unauthenticated GitHub API rate limit when fetching flake inputs.
          extra_nix_config: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Restore pub cache
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: nix develop .#ci --command flutter pub get

      - name: Run static analysis
        run: nix develop .#ci --command flutter analyze

      - name: Run tests
        run: nix develop .#ci --command flutter test
