name: Lints

# Runs the gatuno_lints analyzer rules on pull requests. The shared flutter-ci
# workflow runs `flutter analyze`, which exits before analyzer plugins report,
# so the rules are enforced here with `dart analyze`.
on:
  push:
    branches:
      - main
      - developer
  pull_request:
    branches:
      - main
      - developer

permissions:
  contents: read

jobs:
  lints:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Flutter and Dart come from flake.lock (devShells.ci), not the stable channel.
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          # Avoids the unauthenticated GitHub API rate limit when fetching flake inputs.
          extra_nix_config: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: nix develop .#ci --command flutter pub get

      - name: Analyze (includes gatuno_lints rules)
        run: nix develop .#ci --command dart analyze

      - name: Test lint rules
        run: nix develop .#ci --command bash -c 'cd tool/gatuno_lints && dart pub get && dart test'
