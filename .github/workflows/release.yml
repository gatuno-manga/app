name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a running release: the bump step pushes to main and moves the
  # tag, and a cancel between the two leaves them out of sync.
  cancel-in-progress: false

jobs:
  validate_and_gate:
    name: Validate release trigger and source
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          # The bump step searches main's history for an earlier bump commit.
          fetch-depth: 0

      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v5
        id: lfs-cache
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: |
            ${{ runner.os }}-lfs-

      - name: Git LFS Pull
        run: git lfs pull

      - name: Validate release tag format
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
              echo "::error::Release workflow must run from a tag ref."
              exit 1
          fi

          TAG="${GITHUB_REF_NAME}"
          if [[ ! "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Invalid release tag '${TAG}'. Expected vMAJOR.MINOR.PATCH."
              exit 1
          fi

      - name: Ensure tag commit is reachable from main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
              echo "::error::Tag commit ${GITHUB_SHA} is not reachable from origin/main."
              exit 1
          fi

      - name: Update version and commit
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The remote tag is the source of truth. A re-run is checked out at
          # the original tag commit, but a previous run may have moved the tag.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          TAGGED_VERSION="$(git show "refs/tags/${TAG}:pubspec.yaml" | sed -n 's/^version: //p')"
          if [[ "${TAGGED_VERSION}" == *+* && "${TAGGED_VERSION%%+*}" == "${VERSION}" ]]; then
              echo "Tag ${TAG} already points at version ${TAGGED_VERSION}. Skipping bump."
              exit 0
          fi

          # Partial state: a previous run pushed the bump to main but did not
          # move the tag. Reuse that commit instead of bumping twice.
          BUMP_SHA=""
          while read -r candidate; do
              candidate_version="$(git show "${candidate}:pubspec.yaml" | sed -n 's/^version: //p')"
              if [[ "${candidate_version}" == *+* && "${candidate_version%%+*}" == "${VERSION}" ]] \
                  && git merge-base --is-ancestor "${GITHUB_SHA}" "${candidate}"; then
                  BUMP_SHA="${candidate}"
                  break
              fi
          done < <(git log origin/main --format=%H --fixed-strings --grep="chore: bump version to ${VERSION}+")

          if [[ -n "${BUMP_SHA}" ]]; then
              echo "Reusing bump commit ${BUMP_SHA} already on main."
          else
              sed -i -e "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" pubspec.yaml
              git add pubspec.yaml
              git commit -m "chore: bump version to ${VERSION}+${BUILD_NUMBER} [skip ci]"
              git push origin HEAD:main
              BUMP_SHA="$(git rev-parse HEAD)"
          fi

          # Point the tag at the bump commit so the release builds from it.
          git tag -f "${TAG}" "${BUMP_SHA}"
          git push origin -f "refs/tags/${TAG}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in sync with the Flutter version in flake.lock (see CONTRIBUTING.md).
          # Not built through nix: the flake shell is unverified on macOS.
          flutter-version: '3.47.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: dart analyze

      - name: Run tests
        run: flutter test

      - name: Test lint rules
        run: cd tool/gatuno_lints && dart pub get && dart test

  build_android:
    name: Build Android (APK & AAB)
    needs: validate_and_gate
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v5
        id: lfs-cache
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: |
            ${{ runner.os }}-lfs-

      - name: Git LFS Pull
        run: git lfs pull

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in sync with the Flutter version in flake.lock (see CONTRIBUTING.md).
          # Not built through nix: the flake shell is unverified on macOS.
          flutter-version: '3.47.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build AppBundle
        run: flutter build appbundle --release

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/gatuno-android-${{ github.ref_name }}.apk
          cp build/app/outputs/bundle/release/app-release.aab artifacts/gatuno-android-${{ github.ref_name }}.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gatuno-android-artifacts
          path: artifacts/*

  build_ios:
    name: Build iOS (Unsigned)
    needs: validate_and_gate
    runs-on: macos-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v5
        id: lfs-cache
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: |
            ${{ runner.os }}-lfs-

      - name: Git LFS Pull
        run: git lfs pull

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in sync with the Flutter version in flake.lock (see CONTRIBUTING.md).
          # Not built through nix: the flake shell is unverified on macOS.
          flutter-version: '3.47.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Compress iOS App
        run: |
          mkdir -p artifacts
          cd build/ios/iphoneos
          zip -r ../../../artifacts/gatuno-ios-${{ github.ref_name }}.zip Runner.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: gatuno-ios-artifact
          path: artifacts/gatuno-ios-*.zip

  publish_release:
    name: Publish GitHub Release
    needs: [build_android, build_ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" &>/dev/null; then
            echo "Release already exists. Updating artifacts and notes..."
            gh release upload "${TAG}" artifacts/* --clobber
            NOTES="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${TAG}" --jq .body)"
            gh release edit "${TAG}" --notes "${NOTES}"
          else
            echo "Creating new release..."
            gh release create "${TAG}" \
              artifacts/* \
              --title "Release ${TAG}" \
              --generate-notes \
              --draft=false \
              --prerelease=false
          fi
