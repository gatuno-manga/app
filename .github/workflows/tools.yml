name: Tools

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  issues: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: jaoppb/tools@v0.2.0
        with:
          version: v0.2.0
          check-issues: 'true'
          check-repo: 'true'
