name: Tools

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  issues: read

concurrency:
  group: tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: jaoppb/tools@v0.2.0
        with:
          version: v0.2.0
          check-issues: 'true'
          check-repo: 'true'
