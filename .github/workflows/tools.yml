name: Tools

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  issues: read

concurrency:
  group: tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: jaoppb/tools@v0.2.0
        with:
          version: v0.2.0
          check-issues: 'true'
          check-repo: 'true'
          # The default GITHUB_TOKEN (contents: read) cannot read merge settings
          # (squash/rebase/delete-branch), so repo-sync would report a false
          # "in sync". Check only labels and milestones here; verify the merge
          # settings locally with `just repo-check`.
          repo-sync-args: '--labels --milestones'
