name: Feature
description: New behaviour or capability
labels: ["type:feat"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Maintainers will apply the matching `area:*` label.
      options:
        - area:app
        - area:reader
        - area:library
        - area:auth
        - area:sync
        - area:ci
        - area:docs
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should the app do, and why?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in and out of scope, and how will we know it works?
