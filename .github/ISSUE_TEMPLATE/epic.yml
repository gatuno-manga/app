name: Epic
description: A parent issue that groups related work
labels: ["type:feat"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Maintainers will apply the matching `area:*` label.
      options:
        - area:app
        - area:reader
        - area:library
        - area:auth
        - area:sync
        - area:ci
        - area:docs
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The outcome this epic delivers.
    validations:
      required: true
  - type: textarea
    id: children
    attributes:
      label: Child issues
      description: Task list of the issues that make up this epic (`- [ ] #N`).
