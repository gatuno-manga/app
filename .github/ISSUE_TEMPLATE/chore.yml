name: Chore
description: Tooling, housekeeping, dependencies
labels: ["type:chore"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Maintainers will apply the matching `area:*` label.
      options:
        - area:app
        - area:reader
        - area:library
        - area:auth
        - area:sync
        - area:ci
        - area:docs
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What needs to change and why?
    validations:
      required: true
