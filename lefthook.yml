# Lefthook configuration (https://github.com/evilmartians/lefthook)
# Hooks call `just` recipes; run them inside the dev shell (`nix develop`).

pre-commit:
  parallel: false
  commands:
    fmt:
      priority: 1
      glob: "lib/**/*.dart"
      run: just fmt {staged_files}
      stage_fixed: true
    fix:
      priority: 2
      glob: "lib/**/*.dart"
      run: just fix
      stage_fixed: true
    analyze:
      priority: 3
      run: just analyze
