include: package:flutter_lints/flutter.yaml

# Flutter UI rules (tool/gatuno_lints): hardcoded colors, inline TextStyle,
# small tap targets, missing Semantics. Warnings are on by default; silence a
# justified exception with `// ignore: gatuno_lints/<rule>` and a reason.
plugins:
  gatuno_lints:
    path: tool/gatuno_lints

analyzer:
  exclude:
    - 'tool/gatuno_lints/**'
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - 'lib/generated_plugin_registrant.dart'
    - build/**
    - android/**
    - ios/**

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    missing_required_param: error
    missing_return: error
    todo: ignore

linter:
  rules:
    prefer_double_quotes: false
    always_declare_return_types: true
    cancel_subscriptions: true
    close_sinks: true
    avoid_print: true
    require_trailing_commas: true
    sort_child_properties_last: true
